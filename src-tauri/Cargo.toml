[package]
name = "mdv"
version = "0.1.0"
description = "Native minimalist Markdown focus viewer"
authors = ["jcx"]
edition = "2024"

[lib]
name = "mdv_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
tauri = { version = "2.12.5" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.15"
notify = "6.1"
